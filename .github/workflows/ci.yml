name: CI

on: [push]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, windows-11-arm]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Verify Scarlet.Bun.Sample outputs
        shell: bash
        run: |
          failed=0
          if [ -f "samples/Scarlet.Bun.Sample/wwwroot/js/bundle.min.js" ]; then
            echo "✓ JavaScript bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample/wwwroot/js/bundle.min.js
          else
            echo "⚠ JavaScript bundle not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample/wwwroot/css/style.min.css" ]; then
            echo "✓ CSS bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample/wwwroot/css/style.min.css
          else
            echo "⚠ CSS bundle not found"
            failed=1
          fi
          
          exit $failed

      - name: Verify Scarlet.Bun.Sample.Download outputs
        shell: bash
        run: |
          failed=0
          if find samples/Scarlet.Bun.Sample.Download/runtimes -type f \( -name "bun" -o -name "bun.exe" \) | grep -q .; then
            echo "✓ Runtime was downloaded successfully"
            find samples/Scarlet.Bun.Sample.Download/runtimes -type f \( -name "bun" -o -name "bun.exe" \) -ls
          else
            echo "⚠ Runtime not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample.Download/wwwroot/js/bundle.min.js" ]; then
            echo "✓ JavaScript bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample.Download/wwwroot/js/bundle.min.js
          else
            echo "⚠ JavaScript bundle not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample.Download/wwwroot/css/style.min.css" ]; then
            echo "✓ CSS bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample.Download/wwwroot/css/style.min.css
          else
            echo "⚠ CSS bundle not found"
            failed=1
          fi
          
          exit $failed

      - name: Pack NuGet packages
        shell: bash
        run: |
          # Use 0.0.1-ci for testing
          VERSION="0.0.1-ci.${{ github.run_number }}"
          echo "Packing with version: $VERSION"

          # Extract BunVersion from Directory.Build.props
          BUN_VERSION=$(sed -n 's/.*<BunVersion>\([^<]*\)<\/BunVersion>.*/\1/p' Directory.Build.props)
          echo "Runtime package version (BunVersion): $BUN_VERSION"

          # Pack the main MSBuild package
          dotnet pack src/Scarlet.Bun.MSBuild/Scarlet.Bun.MSBuild.csproj \
            --no-build \
            --configuration Release \
            --output ./packages -p:Version=$VERSION

          # Pack all runtime packages (without --no-build because they need to restore and copy binaries)
          # Runtime packages use BunVersion from their .csproj, no -p:Version override
          dotnet pack src/Scarlet.Bun.Runtime.windows-x64-baseline/Scarlet.Bun.Runtime.windows-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-baseline/Scarlet.Bun.Runtime.linux-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64/Scarlet.Bun.Runtime.linux-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-x64-baseline/Scarlet.Bun.Runtime.darwin-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.windows-aarch64/Scarlet.Bun.Runtime.windows-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-aarch64/Scarlet.Bun.Runtime.darwin-aarch64.csproj \
            --configuration Release \
            --output ./packages

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUN_VERSION=$BUN_VERSION" >> $GITHUB_ENV

      - name: List generated packages
        shell: bash
        run: ls -lh ./packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg

      - name: E2E Test - Package installation
        shell: bash
        run: |
          chmod +x tests/e2e/package-installation/verify.sh
          tests/e2e/package-installation/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: E2E Test - Monorepo download
        shell: bash
        run: |
          chmod +x tests/e2e/monorepo-download/verify.sh
          tests/e2e/monorepo-download/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: E2E Test - Multi-TFM
        shell: bash
        run: |
          chmod +x tests/e2e/multi-tfm/verify.sh
          tests/e2e/multi-tfm/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          flags: ${{ matrix.os }}
          name: codecov-${{ matrix.os }}
