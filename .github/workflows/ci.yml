name: CI

on: [push]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, windows-11-arm]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Verify Scarlet.Bun.Sample outputs
        shell: bash
        run: |
          failed=0
          if [ -f "samples/Scarlet.Bun.Sample/wwwroot/js/bundle.min.js" ]; then
            echo "✓ JavaScript bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample/wwwroot/js/bundle.min.js
          else
            echo "⚠ JavaScript bundle not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample/wwwroot/css/style.min.css" ]; then
            echo "✓ CSS bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample/wwwroot/css/style.min.css
          else
            echo "⚠ CSS bundle not found"
            failed=1
          fi
          
          exit $failed

      - name: Verify Scarlet.Bun.Sample.Download outputs
        shell: bash
        run: |
          failed=0
          if find samples/Scarlet.Bun.Sample.Download/runtimes -type f \( -name "bun" -o -name "bun.exe" \) | grep -q .; then
            echo "✓ Runtime was downloaded successfully"
            find samples/Scarlet.Bun.Sample.Download/runtimes -type f \( -name "bun" -o -name "bun.exe" \) -ls
          else
            echo "⚠ Runtime not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample.Download/wwwroot/js/bundle.min.js" ]; then
            echo "✓ JavaScript bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample.Download/wwwroot/js/bundle.min.js
          else
            echo "⚠ JavaScript bundle not found"
            failed=1
          fi
          if [ -f "samples/Scarlet.Bun.Sample.Download/wwwroot/css/style.min.css" ]; then
            echo "✓ CSS bundle created successfully"
            ls -lh samples/Scarlet.Bun.Sample.Download/wwwroot/css/style.min.css
          else
            echo "⚠ CSS bundle not found"
            failed=1
          fi
          
          exit $failed

      - name: Pack NuGet packages
        shell: bash
        run: |
          # Use 0.0.1-ci for testing
          VERSION="0.0.1-ci.${{ github.run_number }}"
          echo "Packing with version: $VERSION"

          # Extract BunVersion from Directory.Build.props
          BUN_VERSION=$(sed -n 's/.*<BunVersion>\([^<]*\)<\/BunVersion>.*/\1/p' Directory.Build.props)
          echo "Runtime package version (BunVersion): $BUN_VERSION"

          # Pack the main MSBuild package
          dotnet pack src/Scarlet.Bun.MSBuild/Scarlet.Bun.MSBuild.csproj \
            --no-build \
            --configuration Release \
            --output ./packages -p:Version=$VERSION

          # Pack all runtime packages (without --no-build because they need to restore and copy binaries)
          # Runtime packages use BunVersion from their .csproj, no -p:Version override
          dotnet pack src/Scarlet.Bun.Runtime.windows-x64-baseline/Scarlet.Bun.Runtime.windows-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-baseline/Scarlet.Bun.Runtime.linux-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64/Scarlet.Bun.Runtime.linux-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-musl-baseline/Scarlet.Bun.Runtime.linux-x64-musl-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64-musl/Scarlet.Bun.Runtime.linux-aarch64-musl.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-x64-baseline/Scarlet.Bun.Runtime.darwin-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.windows-aarch64/Scarlet.Bun.Runtime.windows-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-aarch64/Scarlet.Bun.Runtime.darwin-aarch64.csproj \
            --configuration Release \
            --output ./packages

          # Pack the dotnet tool. Like the runtime packages it versions from BunVersion, so no -p:Version;
          # and no --no-build, because one pack fans out into a build per runtime identifier. This produces
          # the eight RID packages, the portable 'any' package and the top-level pointer package.
          dotnet pack src/Scarlet.Bun.Cli/Scarlet.Bun.Cli.csproj \
            --configuration Release \
            --output ./packages

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUN_VERSION=$BUN_VERSION" >> $GITHUB_ENV

      - name: List generated packages
        shell: bash
        run: ls -lh ./packages/

      # Only the Scarlet.Bun.Cli *RID* packages are excluded: each embeds a 60-90 MB Bun, so uploading all
      # eight from every matrix leg would cost gigabytes per push for no diagnostic value - the CLI E2E step
      # consumes them straight off disk instead. The pointer and 'any' packages are kept: they are a few
      # hundred KB each and are exactly what you want to inspect when tool resolution misbehaves.
      # (linux-musl-* RID packages match the linux-* exclusion below too.)
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg
            !./packages/Scarlet.Bun.Cli.win-*.nupkg
            !./packages/Scarlet.Bun.Cli.linux-*.nupkg
            !./packages/Scarlet.Bun.Cli.osx-*.nupkg

      - name: E2E Test - Package installation
        shell: bash
        run: |
          chmod +x tests/e2e/package-installation/verify.sh
          tests/e2e/package-installation/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: E2E Test - Monorepo download
        shell: bash
        run: |
          chmod +x tests/e2e/monorepo-download/verify.sh
          tests/e2e/monorepo-download/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: E2E Test - Multi-TFM
        shell: bash
        run: |
          chmod +x tests/e2e/multi-tfm/verify.sh
          tests/e2e/multi-tfm/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: E2E Test - Incremental skipping
        shell: bash
        run: |
          chmod +x tests/e2e/incremental/verify.sh
          tests/e2e/incremental/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      # Runs on every matrix leg deliberately: this is the only thing that proves the correct RID
      # sub-package is selected on win-arm64 and linux-arm64, and that the embedded Bun is executable
      # after NuGet extraction strips the Unix permission bits.
      - name: E2E Test - CLI tool
        shell: bash
        run: |
          chmod +x tests/e2e/cli-tool/verify.sh
          tests/e2e/cli-tool/verify.sh "${{ github.workspace }}" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          flags: ${{ matrix.os }}
          name: codecov-${{ matrix.os }}

  # No GitHub-hosted runner offers musl/Alpine natively, unlike every other platform above which runs on
  # its own native OS. This runs inside a musl-based .NET SDK container on top of a regular Linux runner
  # instead, so the musl runtime packages get proven against a real musl libc rather than just unzipped.
  test-musl:
    name: Test on Linux musl / Alpine (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
      fail-fast: false

    steps:
      - name: Install build prerequisites
        run: apk add --no-cache bash curl unzip icu-libs git

      # actions/checkout is a JS action, and the runner's bundled Node build for Alpine containers only
      # covers x64 - on the arm64 leg it fails with "JavaScript Actions in Alpine containers are only
      # supported on x64 Linux runners". git is a native binary, so it works on both legs regardless.
      - name: Checkout code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      - name: Pack NuGet packages
        shell: bash
        run: |
          # Use 0.0.1-ci for testing
          VERSION="0.0.1-ci.${{ github.run_number }}"
          echo "Packing with version: $VERSION"

          # Extract BunVersion from Directory.Build.props
          BUN_VERSION=$(sed -n 's/.*<BunVersion>\([^<]*\)<\/BunVersion>.*/\1/p' Directory.Build.props)
          echo "Runtime package version (BunVersion): $BUN_VERSION"

          # Needed by the package-installation E2E test below, which references it by name/version.
          dotnet pack src/Scarlet.Bun.MSBuild/Scarlet.Bun.MSBuild.csproj \
            --no-build \
            --configuration Release \
            --output ./packages -p:Version=$VERSION

          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-musl-baseline/Scarlet.Bun.Runtime.linux-x64-musl-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64-musl/Scarlet.Bun.Runtime.linux-aarch64-musl.csproj \
            --configuration Release \
            --output ./packages

          # Fans out into a build per runtime identifier, same as on the native-OS legs; only the two musl
          # RID packages, the portable 'any' package and the pointer package are of interest here.
          dotnet pack src/Scarlet.Bun.Cli/Scarlet.Bun.Cli.csproj \
            --configuration Release \
            --output ./packages

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUN_VERSION=$BUN_VERSION" >> $GITHUB_ENV

      - name: List generated packages
        run: ls -lh ./packages/

      # Proves Scarlet.Bun.MSBuild itself resolves and runs a musl Bun via the BunRuntimePack contract,
      # not just that the CLI tool does.
      #
      # $GITHUB_WORKSPACE (the env var), not ${{ github.workspace }} (the expression): inside a job-level
      # container the expression resolves to the HOST path (/home/runner/work/...), which does not exist
      # inside the container's filesystem, while the env var correctly reports the container-side mount
      # (/__w/...) that dotnet pack actually wrote ./packages under.
      - name: E2E Test - Package installation
        shell: bash
        run: |
          chmod +x tests/e2e/package-installation/verify.sh
          tests/e2e/package-installation/verify.sh "$GITHUB_WORKSPACE" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"

      # This is what actually proves the musl binaries execute on real musl libc, not just that the zip
      # unpacked correctly: it installs the tool, and dotnet --info inside this container reports a
      # linux-musl-* RID, so the CLI's generic RID detection (tests/e2e/cli-tool/verify.sh) picks the
      # musl-specific package and runs the embedded Bun for real.
      - name: E2E Test - CLI tool
        shell: bash
        run: |
          chmod +x tests/e2e/cli-tool/verify.sh
          tests/e2e/cli-tool/verify.sh "$GITHUB_WORKSPACE" "${{ env.VERSION }}" "${{ env.BUN_VERSION }}"
