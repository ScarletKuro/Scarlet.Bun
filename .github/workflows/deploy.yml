name: Deploy to NuGet

on:
  push:
    tags:
      # Matches SemVer 2 tags: 1.0.0, 1.0.0-preview.1, 1.0.0-rc.1, etc.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # Run tests before deploying
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

  deploy:
    name: Build and Deploy to NuGet
    runs-on: ubuntu-latest
    # Only run deploy if all tests pass
    needs: test
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: get_version
        run: |
          # Remove 'refs/tags/' prefix to get just the version number
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.get_version.outputs.version }}

      - name: Pack NuGet packages
        run: |
          # Pack the main MSBuild package
          dotnet pack src/Scarlet.Bun.MSBuild/Scarlet.Bun.MSBuild.csproj \
            --no-build \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}
          
          # Pack all runtime packages (without --no-build because they need to restore and copy binaries)
          dotnet pack src/Scarlet.Bun.Runtime.windows-x64-baseline/Scarlet.Bun.Runtime.windows-x64-baseline.csproj \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}
          
          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-baseline/Scarlet.Bun.Runtime.linux-x64-baseline.csproj \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}
          
          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64/Scarlet.Bun.Runtime.linux-aarch64.csproj \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}
          
          dotnet pack src/Scarlet.Bun.Runtime.darwin-x64-baseline/Scarlet.Bun.Runtime.darwin-x64-baseline.csproj \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}
          
          dotnet pack src/Scarlet.Bun.Runtime.darwin-aarch64/Scarlet.Bun.Runtime.darwin-aarch64.csproj \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}

      - name: List generated packages
        run: ls -lh ./packages/

      - name: Push packages to NuGet
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ secrets.NUGET_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          
          dotnet nuget push "./packages/*.snupkg" \
            --api-key ${{ secrets.NUGET_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create local test project
        run: |
          # Create a temporary directory for testing
          mkdir -p /tmp/nuget-verification
          cd /tmp/nuget-verification
          
          # Create nuget.config to use local packages
          cat > nuget.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="LocalPackages" value="${{ github.workspace }}/packages" />
            </packageSources>
          </configuration>
          EOF
          
          # Create a simple console app that will use the packages
          dotnet new console -n TestBunPackage
          cd TestBunPackage
          
          # Determine the platform-specific runtime package name
          if [[ "$OSTYPE" == "linux-gnu"* ]]; then
            RUNTIME_PACKAGE="Scarlet.Bun.Runtime.linux-x64-baseline"
          elif [[ "$OSTYPE" == "darwin"* ]]; then
            if [[ $(uname -m) == "arm64" ]]; then
              RUNTIME_PACKAGE="Scarlet.Bun.Runtime.darwin-aarch64"
            else
              RUNTIME_PACKAGE="Scarlet.Bun.Runtime.darwin-x64-baseline"
            fi
          else
            RUNTIME_PACKAGE="Scarlet.Bun.Runtime.windows-x64-baseline"
          fi
          
          echo "Using runtime package: $RUNTIME_PACKAGE"
          
          # Add the packages
          dotnet add package Scarlet.Bun.MSBuild --version ${{ steps.get_version.outputs.version }}
          dotnet add package $RUNTIME_PACKAGE --version ${{ steps.get_version.outputs.version }}
          
          # Create a simple package.json
          cat > package.json << 'EOF'
          {
            "name": "test-bun-package",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
          
          # Create a simple build.mjs script
          cat > build.mjs << 'EOF'
          console.log("Bun is working!");
          const fs = require('fs');
          fs.writeFileSync('output.txt', 'Build succeeded!');
          EOF
          
          # Update project file to use Bun target (testing real-world scenario)
          cat > TestBunPackage.csproj << EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            
            <ItemGroup>
              <PackageReference Include="Scarlet.Bun.MSBuild" Version="${{ steps.get_version.outputs.version }}">
                <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
                <PrivateAssets>all</PrivateAssets>
              </PackageReference>
              <PackageReference Include="$RUNTIME_PACKAGE" Version="${{ steps.get_version.outputs.version }}">
                <PrivateAssets>all</PrivateAssets>
              </PackageReference>
            </ItemGroup>
            
            <Target Name="BunInstall" AfterTargets="Build">
              <MSBuild Projects="\$(MSBuildProjectFullPath)"
                       Targets="Bun"
                       Properties="BunCommand=install;BunWorkingDirectory=\$(MSBuildProjectDirectory)" />
            </Target>
            
            <!-- Using MSBuild task to pass per-call properties -->
            <Target Name="BunBuildTest" AfterTargets="Build">
              <MSBuild Projects="\$(MSBuildProjectFullPath)"
                       Targets="Bun"
                       Properties="BunCommand=run;BunArguments=build.mjs;BunWorkingDirectory=\$(MSBuildProjectDirectory)" />
            </Target>
          </Project>
          EOF

      - name: Build and verify test project
        run: |
          cd /tmp/nuget-verification/TestBunPackage
          
          # Build the test project (this should trigger BunRunTask)
          dotnet build --verbosity minimal
          
          # Verify that the build.mjs created the output file
          if [ -f "output.txt" ]; then
            echo "✓ Bun executed successfully via NuGet package!"
            cat output.txt
          else
            echo "✗ Bun execution failed - output.txt not found"
            exit 1
          fi
          
          echo "✓ NuGet package verification completed successfully!"
