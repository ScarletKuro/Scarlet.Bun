name: Deploy to NuGet

on:
  push:
    tags:
      # Matches SemVer 2 tags: 1.0.0, 1.0.0-preview.1, 1.0.0-rc.1, etc.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # Run tests before deploying
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, windows-11-arm]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

  deploy:
    name: Build and Deploy to NuGet
    runs-on: ubuntu-latest
    # Only run deploy if all tests pass
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: get_version
        run: |
          # Remove 'refs/tags/' prefix to get just the version number
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.get_version.outputs.version }}

      - name: Extract BunVersion
        id: get_bun_version
        run: |
          BUN_VERSION=$(sed -n 's/.*<BunVersion>\([^<]*\)<\/BunVersion>.*/\1/p' Directory.Build.props)
          echo "bun_version=$BUN_VERSION"
          echo "bun_version=$BUN_VERSION" >> $GITHUB_OUTPUT

          # The CLI package version is $(BunVersion).$(BunCliRevision), and NuGet normalises a trailing
          # zero away - so revision 0 produces Scarlet.Bun.Cli.1.4.2.nupkg, not 1.4.2.0. The push step
          # needs the real filename to identify the pointer package, which must be published last.
          BUN_CLI_REVISION=$(sed -n 's/.*<BunCliRevision>\([^<]*\)<\/BunCliRevision>.*/\1/p' Directory.Build.props)
          if [ "$BUN_CLI_REVISION" = "0" ]; then
            CLI_VERSION="$BUN_VERSION"
          else
            CLI_VERSION="$BUN_VERSION.$BUN_CLI_REVISION"
          fi
          echo "cli_version=$CLI_VERSION"
          echo "cli_version=$CLI_VERSION" >> $GITHUB_OUTPUT

      - name: Pack NuGet packages
        run: |
          # Pack the main MSBuild package
          dotnet pack src/Scarlet.Bun.MSBuild/Scarlet.Bun.MSBuild.csproj \
            --no-build \
            --configuration Release \
            --output ./packages \
            /p:Version=${{ steps.get_version.outputs.version }}

          # Pack all runtime packages (without --no-build because they need to restore and copy binaries)
          # Runtime packages use BunVersion from their .csproj, no /p:Version override
          dotnet pack src/Scarlet.Bun.Runtime.windows-x64-baseline/Scarlet.Bun.Runtime.windows-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-x64-baseline/Scarlet.Bun.Runtime.linux-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.linux-aarch64/Scarlet.Bun.Runtime.linux-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-x64-baseline/Scarlet.Bun.Runtime.darwin-x64-baseline.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.windows-aarch64/Scarlet.Bun.Runtime.windows-aarch64.csproj \
            --configuration Release \
            --output ./packages

          dotnet pack src/Scarlet.Bun.Runtime.darwin-aarch64/Scarlet.Bun.Runtime.darwin-aarch64.csproj \
            --configuration Release \
            --output ./packages

          # Pack the dotnet tool. Like the runtime packages it versions from BunVersion, so no /p:Version;
          # and no --no-build, because one pack fans out into a build per runtime identifier. This produces
          # the six RID packages, the portable 'any' package and the top-level pointer package.
          dotnet pack src/Scarlet.Bun.Cli/Scarlet.Bun.Cli.csproj \
            --configuration Release \
            --output ./packages

      - name: List generated packages
        run: ls -lh ./packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.get_version.outputs.version }}
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg

      # Validation runs against the local ./packages folder, BEFORE anything is published. NuGet packages
      # are immutable and cannot be unpublished, so discovering a packaging or tool-install failure after
      # the push would leave a broken release permanently public.
      - name: E2E Test - Package installation and verification
        run: |
          chmod +x tests/e2e/package-installation/verify.sh
          tests/e2e/package-installation/verify.sh "${{ github.workspace }}" "${{ steps.get_version.outputs.version }}" "${{ steps.get_bun_version.outputs.bun_version }}"

      - name: E2E Test - CLI tool
        run: |
          chmod +x tests/e2e/cli-tool/verify.sh
          tests/e2e/cli-tool/verify.sh "${{ github.workspace }}" "${{ steps.get_version.outputs.version }}" "${{ steps.get_bun_version.outputs.bun_version }}"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        shell: bash
        run: |
          # The .NET CLI picks a tool's RID-specific package using the version of the top-level pointer
          # package, so the pointer has to be the LAST thing to appear on the feed. A "*.nupkg" glob pushes
          # in lexicographic order, and '.' sorts before any letter, which puts
          # Scarlet.Bun.Cli.<version>.nupkg ahead of Scarlet.Bun.Cli.<rid>.<version>.nupkg - exactly the
          # wrong way round. Any install during that window fails.
          CLI_POINTER="./packages/Scarlet.Bun.Cli.${{ steps.get_bun_version.outputs.cli_version }}.nupkg"

          if [ ! -f "$CLI_POINTER" ]; then
            echo "Expected the Scarlet.Bun.Cli pointer package at $CLI_POINTER"
            ls -1 ./packages/
            exit 1
          fi

          for package in ./packages/*.nupkg; do
            [ "$package" = "$CLI_POINTER" ] && continue
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

          dotnet nuget push "$CLI_POINTER" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          # Same ordering rule as above: every RID package first, the pointer last.
          CLI_POINTER="./packages/Scarlet.Bun.Cli.${{ steps.get_bun_version.outputs.cli_version }}.nupkg"

          for package in ./packages/*.nupkg; do
            [ "$package" = "$CLI_POINTER" ] && continue
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

          dotnet nuget push "$CLI_POINTER" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

